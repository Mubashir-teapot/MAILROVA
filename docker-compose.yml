services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No host port. Only `backend` needs to reach this, over the compose
    # network by service name (`db:5432`) — that works with no `ports`/
    # `expose` at all, since containers on the same network always reach
    # each other directly. Never touches the internet.
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted outbound mail server (Postfix + OpenDKIM, direct-to-MX
  # delivery — no third-party relay). The backend manages this container's
  # domain list live via the Docker socket (see domains module) whenever a
  # domain is added/removed, so it restarts itself to pick up new DKIM keys.
  #
  # Port 25 is real SMTP, not HTTP — Traefik/Dokploy's domain routing is for
  # HTTP(S) services and doesn't apply here, so this has to be published
  # straight to the host, unlike backend/frontend/db below. A host can only
  # have ONE process bound to port 25 at a time: if this VPS already runs
  # another mail server (or another Dokploy project's own mta), `docker
  # compose up` will fail loudly with "port is already allocated" instead of
  # silently colliding — that's the safety net. Check what's holding it with
  # `sudo ss -tlnp | grep :25` and free it, or run this stack's mail on a
  # dedicated IP if the host has more than one. If you don't need to receive
  # bounces/replies on this domain, you can drop this `ports` block entirely
  # and outbound sending still works (Postfix can send without listening).
  # Built from ./mta (extends boky/postfix) instead of used directly — adds
  # bounce-DSN routing so a hard/soft bounce on a self-hosted send actually
  # gets detected (see mta/README.md and the /webhooks/bounce/postfix
  # handler). env_file gives forward-bounce.sh BACKEND_PORT/BOUNCE_WEBHOOK_KEY.
  mta:
    build:
      context: ./mta
    container_name: mailrova-mta
    restart: unless-stopped
    env_file: .env
    environment:
      ALLOWED_SENDER_DOMAINS: ""
      # boky/postfix refuses to start with ALLOWED_SENDER_DOMAINS empty
      # unless this is set — true on first boot, before any domain has been
      # added from the Domains page. dockerService.ts fills in a real
      # ALLOWED_SENDER_DOMAINS value (and recreates this container) the
      # moment the first domain is added; this stays set permanently since
      # it's harmless once that happens.
      ALLOW_EMPTY_SENDER_DOMAINS: "1"
      DKIM_AUTOGENERATE: "1"
    ports:
      - "25:25"
    volumes:
      - mta_dkim_keys:/etc/opendkim/keys

  # Sits between the backend and the real Docker socket, exposing only the
  # exact API surface `dockerService.ts` needs (inspect/create/start/stop/
  # remove a container) instead of full unrestricted (root-equivalent) socket
  # access. Everything else — images, volumes, networks, exec, secrets,
  # swarm, etc. — stays off by default (this image's flags default to 0).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: mailrova-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    # No host port, and no Dokploy Domain either — the backend is never
    # exposed to the internet directly. `frontend`'s Next.js server proxies
    # /api/* to it over this internal network (see
    # frontend/next.config.js), so only `frontend` needs a public Domain.
    expose:
      - "${BACKEND_PORT:-4000}"
    depends_on:
      db:
        condition: service_healthy
      mta:
        condition: service_started
      docker-proxy:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
      - mta_dkim_keys:/mta-dkim-keys:ro

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file: .env
    # The only service that should get a public Domain in Dokploy. Its
    # Next.js server proxies /api/* to `backend` internally, so a domain
    # here is the single public entry point for the whole app.
    expose:
      - "${FRONTEND_PORT:-5173}"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  db_data:
  backend_uploads:
  mta_dkim_keys:
